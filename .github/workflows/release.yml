name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Build Binary
        run: |
          mkdir -p dist
          go build -v -o dist/zee-mirror ./cmd/zee-mirror

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/zee-mirror
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
