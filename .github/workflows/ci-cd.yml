name: Zee-Mirror CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-quality:
    name: Backend Quality & Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Run GolangCI-Lint
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
          golangci-lint run --timeout=5m ./...

      - name: Security Audit (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Run Tests
        run: go test -v -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Coverage Summary
        run: go tool cover -func=coverage.out | tail -n 1

      - name: Coverage Gate
        run: |
          TOTAL=$(go tool cover -func=coverage.out | grep total | awk '{gsub(/%/,"",$3); print $3}')
          echo "Total coverage: ${TOTAL}%"
          awk -v t="$TOTAL" 'BEGIN { if (t+0 < 10) { print "::error::Coverage " t "% is below the 10% floor"; exit 1 } }'

  frontend-build:
    name: Frontend Build Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./dashboard
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint Frontend
        run: npm run lint --if-present

      - name: Build Frontend
        run: npm run build

  build-docker:
    name: Build Docker Image
    needs: [backend-quality, frontend-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Load
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false 
          tags: zee-mirror:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
