name: Zee-Mirror CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          
      - name: Install dependencies
        run: go mod download
        
      - name: Run Tests
        run: go test -v ./...

  build-docker:
    name: Build Docker Image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Build and Load
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false 
          tags: zee-mirror:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
