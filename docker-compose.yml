# Zee-Mirror Telegram Bot - Docker Compose Configuration
# Usage: docker-compose up -d

services:
  zee-mirror:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zee-mirror-bot
    restart: unless-stopped
    
    # Environment variables
    environment:
      # Required - Telegram Bot Token dari @BotFather
      - BOT_TOKEN=${BOT_TOKEN}
      
      # Required - Telegram User ID owner (bisa dapat dari @userinfobot)
      - OWNER_ID=${OWNER_ID}
      
      # Optional - Daftar user yang diizinkan (comma-separated)
      - AUTHORIZED_USERS=${AUTHORIZED_USERS:-}
      
      # Rclone remote destination (format: remote:path)
      - RCLONE_DEST=${RCLONE_DEST:-gdrive:/MirrorBot}
      
      # Maximum concurrent downloads
      - MAX_CONCURRENT_DOWNLOADS=${MAX_CONCURRENT_DOWNLOADS:-3}
      
      # Timezone
      - TZ=${TZ:-Asia/Jakarta}
    
    # Volumes
    volumes:
      # Direktori untuk file download temporary
      - ./downloads:/app/downloads
      
      # Direktori untuk config files (rclone.conf)
      - ./config:/app/config
    
    # Resource limits (optional, uncomment jika diperlukan)
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '2'
    #       memory: 2G
    #     reservations:
    #       cpus: '0.5'
    #       memory: 512M
    
    # Network mode
    networks:
      - zee-network
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    # Security options
    security_opt:
      - no-new-privileges:true

networks:
  zee-network:
    driver: bridge
