services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: telegram-bot-api
    restart: unless-stopped
    environment:
      - TELEGRAM_API_ID=${TELEGRAM_API_ID}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH}
      - TELEGRAM_LOCAL=1
    volumes:
      - downloads:/var/lib/telegram-bot-api
    networks:
      - zee-network

  zee-mirror:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zee-mirror-bot
    restart: unless-stopped
    depends_on:
      - telegram-bot-api
    ports:
      - "${DASHBOARD_PORT:-80}:8080"
    
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - OWNER_ID=${OWNER_ID}
      - AUTHORIZED_USERS=${AUTHORIZED_USERS:-}
      - RCLONE_DEST=${RCLONE_DEST:-gdrive:/MirrorBot}
      - MAX_CONCURRENT_DOWNLOADS=${MAX_CONCURRENT_DOWNLOADS:-3}
      - TZ=${TZ:-Asia/Jakarta}
      - TELEGRAM_API=http://telegram-bot-api:8081/bot%s/%s
      - WEB_DASHBOARD_TOKEN=${WEB_DASHBOARD_TOKEN}
      - WEB_DASHBOARD_URL=${WEB_DASHBOARD_URL:-http://localhost}
      - SMART_AUTO_ORGANIZATION=${SMART_AUTO_ORGANIZATION:-false}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - DOWNLOAD_DIR=${DOWNLOAD_DIR:-/app/downloads}
      - CONFIG_DIR=${CONFIG_DIR:-/app/config}
    
    volumes:
      - downloads:/app/downloads
      - ./config:/app/config
    
    # Resource constraints (optional)
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '2'
    #       memory: 2G
    #     reservations:
    #       cpus: '0.5'
    #       memory: 512M
    
    networks:
      - zee-network
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    security_opt:
      - no-new-privileges:true

networks:
  zee-network:
    driver: bridge

volumes:
  downloads:
  configs: