services:
  zee-mirror:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zee-mirror-bot
    restart: unless-stopped
    
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - OWNER_ID=${OWNER_ID}
      - AUTHORIZED_USERS=${AUTHORIZED_USERS:-}
      - RCLONE_DEST=${RCLONE_DEST:-gdrive:/MirrorBot}
      - MAX_CONCURRENT_DOWNLOADS=${MAX_CONCURRENT_DOWNLOADS:-3}
      - TZ=${TZ:-Asia/Jakarta}
    
    volumes:
      - ./downloads:/app/downloads
      - ./config:/app/config
    
    # Resource constraints (optional)
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '2'
    #       memory: 2G
    #     reservations:
    #       cpus: '0.5'
    #       memory: 512M
    
    networks:
      - zee-network
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    security_opt:
      - no-new-privileges:true

networks:
  zee-network:
    driver: bridge